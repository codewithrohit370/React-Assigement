<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput({sandMassages , setMassageFunction}) {
            const [inputText , setInputText] = React.useState('')
            
            function saveInputText(event){
                setInputText(event.target.value)
            }

            function sandMassgae(){

            const newMassgae = [
                ...sandMassages , {
                    massage:inputText,
                    sander:"user",
                    id:crypto.randomUUID()
                }
            ]   
            setMassageFunction(newMassgae)

            const response = Chatbot.getResponse(inputText)
            setMassageFunction([
                ...newMassgae , {
                    massage:response,
                    sander:"robot",
                    id:crypto.randomUUID()
                }
            ])

            setInputText('')
          
        }


            return (
                <>    
                    <input type="text" placeholder="Sand Massage to ChatBot" size='40' onChange={saveInputText} value={inputText}/>
                    <button onClick={sandMassgae}>Submit</button>
                </>    
        )    
        }

        function ChatMassageHtml(props){
            const {massage} = props;
            const {sander} = props;
                
            return (
                
                <div>
                    {sander === 'robot' && <img src="robot.png" width="50"/>}
                    {massage}
                    {sander === 'user' && <img src="user.png" width="50"/>}
                        
                </div>
            )
        }

        function ChatMassageData({sandMassages}){ 

        return (
            <>
                {sandMassages.map((ChatMassage)=>{
                         return (
                                <ChatMassageHtml 
                                    massage={ChatMassage.massage}
                                    sander={ChatMassage.sander}
                                    key={ChatMassage.id}
                                />
                            )
                })}
            </>
        )

        }
       

        function App(){
            const [sandMassages , setMassageFunction] = React.useState([{
            massage:"hello I want a help",
            sander:"user",
            id:"id1"
        },
        {
            massage:"flip a coin",
            sander:"robot",
            id:"id2"
        },
        {
            massage:"head is my",
            sander:"user",
            id:"id3"
        },
        {
            massage:"i Lost",
            sander:"robot",
            id:"id4"
        }    
        ]); 
            
            return (
                <>
                    <ChatInput sandMassages={sandMassages} setMassageFunction={setMassageFunction}/>
                    <ChatMassageData sandMassages={sandMassages} />
                </>
            )
        }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
